[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrocephalus-ml"
version = "0.1.0"
description = "Обучение, оценка и экспорт моделей для анализа МРТ при гидроцефалии"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Стек обучения ставится отдельно: сборка torch +cpu приходит из индекса PyTorch,
# а не с PyPI, поэтому она не должна быть обязательной зависимостью пакета.
training = [
    "nibabel>=5.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydicom>=3.0",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins shadowing
    "C4",  # comprehensions
    "PT",  # pytest style
    "RET", # return
    "SIM", # simplify
    "ARG", # unused arguments
    "PTH", # pathlib
    "RUF",
]
ignore = [
    # RUF001-003 считают кириллицу «неоднозначными» символами, похожими на латиницу.
    # Документация и комментарии проекта ведутся на русском языке, поэтому правило
    # здесь неприменимо: оно предлагало бы транслитерировать осмысленный текст.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
